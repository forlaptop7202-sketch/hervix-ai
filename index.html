<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HERVIX AI</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #202123;
    min-height: 100vh;
}


/* HEADER */

.header {
    height: 65px;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    background: #ffffff;
}

.header-inner {
    width: 100%;
    max-width: 950px;
    margin: auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #111111;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
}

.brand h1 {
    font-size: 18px;
}

.brand p {
    color: #888888;
    font-size: 11px;
    margin-top: 3px;
}

.status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 7px;
    color: #777777;
    font-size: 11px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
}


/* CHAT */

.chat {
    width: 100%;
    max-width: 950px;
    margin: auto;
    padding: 30px 20px 150px;
    min-height: calc(100vh - 65px);
}


/* WELCOME */

.welcome {
    min-height: 65vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.welcome-logo {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    background: #111111;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 20px;
}

.welcome h2 {
    font-size: 30px;
    margin-bottom: 10px;
}

.welcome p {
    color: #777777;
    font-size: 14px;
}


/* SUGGESTIONS */

.suggestions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
    flex-wrap: wrap;
    justify-content: center;
}

.suggestion {
    background: #ffffff;
    border: 1px solid #dddddd;
    border-radius: 10px;
    padding: 10px 14px;
    color: #555555;
    font-size: 12px;
    cursor: pointer;
}

.suggestion:hover {
    background: #f5f5f5;
}


/* MESSAGE */

.message {
    width: 100%;
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    animation: messageIn 0.25s ease;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* AI = LEFT */

.ai-message {
    justify-content: flex-start;
}


/* USER = RIGHT */

.user-message {
    justify-content: flex-end;
}


/* MESSAGE CONTENT */

.message-content {
    max-width: 75%;
    min-width: 0;
}


/* USER CONTENT RIGHT */

.user-message .message-content {
    order: 1;
    text-align: right;
}


/* AI CONTENT LEFT */

.ai-message .message-content {
    order: 2;
    text-align: left;
}


/* AVATAR */

.avatar {
    width: 35px;
    height: 35px;
    min-width: 35px;
    border-radius: 10px;
    background: #111111;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
}


/* USER AVATAR REMOVED */

.user-message .avatar {
    display: none;
}


/* NAME */

.message-name {
    font-size: 11px;
    font-weight: bold;
    color: #777777;
    margin-bottom: 6px;
}


/* TEXT */

.message-text {
    display: inline-block;
    font-size: 14px;
    line-height: 1.65;
    color: #303030;
    white-space: pre-wrap;
    word-wrap: break-word;
    text-align: left;
}


/* USER BUBBLE */

.user-message .message-text {
    background: #111111;
    color: #ffffff;
    padding: 11px 15px;
    border-radius: 15px 15px 4px 15px;
}


/* AI TEXT */

.ai-message .message-text {
    background: #f4f4f4;
    padding: 11px 15px;
    border-radius: 15px 15px 15px 4px;
}


/* THINKING */

.thinking-dots {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 28px;
}

.thinking-dots span {
    width: 8px;
    height: 8px;
    background: #3b82f6;
    border-radius: 50%;
    animation: thinking 1.1s infinite ease-in-out;
}

.thinking-dots span:nth-child(1) {
    animation-delay: 0s;
}

.thinking-dots span:nth-child(2) {
    animation-delay: 0.15s;
}

.thinking-dots span:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes thinking {

    0% {
        transform: translateY(0);
        opacity: 0.35;
    }

    30% {
        transform: translateY(-6px);
        opacity: 1;
    }

    60% {
        transform: translateY(0);
        opacity: 0.6;
    }

    100% {
        transform: translateY(0);
        opacity: 0.35;
    }
}


/* LISTEN BUTTON */

.listen-button {
    display: block;
    margin-top: 8px;
    padding: 7px 11px;
    border: 1px solid #dddddd;
    background: #ffffff;
    color: #555555;
    border-radius: 9px;
    font-size: 11px;
    cursor: pointer;
}

.listen-button:hover {
    background: #f1f1f1;
}


/* INPUT */

.input-container {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    background: linear-gradient(
        to top,
        #ffffff 75%,
        rgba(255,255,255,0)
    );
    padding: 15px 20px 18px;
    z-index: 20;
}

.input-box {
    max-width: 850px;
    margin: auto;
}

.input-area {
    display: flex;
    align-items: center;
    gap: 7px;
    background: #ffffff;
    border: 1px solid #d9d9d9;
    border-radius: 15px;
    padding: 7px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.input-area:focus-within {
    border-color: #aaaaaa;
}

input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: #202123;
    padding: 12px;
    font-size: 14px;
}

input::placeholder {
    color: #999999;
}


/* MIC */

.voice-btn {
    width: 43px;
    height: 43px;
    min-width: 43px;
    border-radius: 11px;
    background: #f1f1f1;
    color: #333333;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.mic-icon {
    width: 20px;
    height: 20px;
}

.voice-btn:hover {
    background: #e6e6e6;
}

.voice-btn.listening {
    background: #eeeeee;
    box-shadow: 0 0 0 5px #e5e5e5;
}


/* SEND */

.send-btn {
    width: 43px;
    height: 43px;
    min-width: 43px;
    border-radius: 11px;
    background: #111111;
    color: #ffffff;
    border: none;
    font-size: 18px;
    cursor: pointer;
}

.send-btn:hover {
    background: #333333;
}


/* FOOTER */

.footer {
    text-align: center;
    color: #999999;
    font-size: 10px;
    margin-top: 7px;
}


/* MOBILE */

@media (max-width: 600px) {

    .header-inner {
        padding: 0 13px;
    }

    .status {
        display: none;
    }

    .chat {
        padding: 20px 12px 140px;
    }

    .welcome {
        min-height: 60vh;
    }

    .welcome h2 {
        font-size: 24px;
    }

    .message-content {
        max-width: 82%;
    }

    .message-text {
        font-size: 14px;
    }

    .input-container {
        padding: 10px 10px 15px;
    }

    .voice-btn,
    .send-btn {
        width: 42px;
        height: 42px;
        min-width: 42px;
    }

    .footer {
        display: none;
    }
}

</style>
</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="header-inner">

        <div class="logo">
            H
        </div>

        <div class="brand">

            <h1>HERVIX AI</h1>

            <p>AI of Hassan Here</p>

        </div>

        <div class="status">

            <span class="status-dot"></span>

            Online

        </div>

    </div>

</header>



<!-- CHAT -->

<main class="chat" id="chat">

    <div class="welcome" id="welcome">

        <div class="welcome-logo">
            H
        </div>

        <h2>
            How can I help you?
        </h2>

        <p>
            Ask HERVIX AI anything.
        </p>

        <div class="suggestions">

            <button
                class="suggestion"
                onclick="useSuggestion('Explain something')"
            >
                Explain something
            </button>

            <button
                class="suggestion"
                onclick="useSuggestion('Help me with coding')"
            >
                Help me with coding
            </button>

            <button
                class="suggestion"
                onclick="useSuggestion('Write something')"
            >
                Write something
            </button>

        </div>

    </div>

</main>



<!-- INPUT -->

<div class="input-container">

    <div class="input-box">

        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Message HERVIX AI..."
                autocomplete="off"
            >


            <!-- MICROPHONE -->

            <button
                class="voice-btn"
                id="voiceButton"
                onclick="startVoice()"
                title="Voice input"
            >

                <svg
                    class="mic-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <rect
                        x="9"
                        y="3"
                        width="6"
                        height="11"
                        rx="3"
                        stroke="currentColor"
                        stroke-width="2"
                    />

                    <path
                        d="M5.5 11.5C5.5 15.09 8.41 18 12 18C15.59 18 18.5 15.09 18.5 11.5"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />

                    <path
                        d="M12 18V21"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />

                    <path
                        d="M9 21H15"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />

                </svg>

            </button>


            <!-- SEND -->

            <button
                class="send-btn"
                onclick="sendMessage()"
                title="Send"
            >
                ➤
            </button>

        </div>


        <div class="footer">
            HERVIX AI — Created by Hassan Here
        </div>

    </div>

</div>



<script>


/* =========================
   VOICE INPUT
========================= */

let recognition = null;
let isListening = false;


function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "Voice input is not supported. Please use Google Chrome."
        );

        return;
    }


    if (isListening) {

        recognition.stop();

        return;
    }


    recognition =
        new SpeechRecognition();


    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;


    recognition.onstart = function() {

        isListening = true;

        document
            .getElementById("voiceButton")
            .classList.add("listening");

    };


    recognition.onresult = function(event) {

        const transcript =
            event.results[0][0].transcript;


        document.getElementById(
            "messageInput"
        ).value = transcript;

    };


    recognition.onend = function() {

        isListening = false;

        document
            .getElementById("voiceButton")
            .classList.remove("listening");

    };


    recognition.onerror = function(event) {

        console.log(
            "Voice error:",
            event.error
        );

    };


    recognition.start();

}



/* =========================
   THINKING
========================= */

function showThinking() {

    const chat =
        document.getElementById("chat");


    const message =
        document.createElement("div");


    message.className =
        "message ai-message";


    message.id =
        "thinkingMessage";


    message.innerHTML = `

        <div class="avatar">
            H
        </div>

        <div class="message-content">

            <div class="message-name">
                HERVIX AI
            </div>

            <div class="thinking-dots">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    chat.appendChild(message);

    scrollToBottom();

}



/* =========================
   REMOVE THINKING
========================= */

function removeThinking() {

    const thinking =
        document.getElementById(
            "thinkingMessage"
        );


    if (thinking) {
        thinking.remove();
    }

}



/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    const chat =
        document.getElementById("chat");


    const welcome =
        document.getElementById("welcome");


    if (welcome) {
        welcome.remove();
    }


    /* USER MESSAGE - RIGHT */

    const userMessage =
        document.createElement("div");


    userMessage.className =
        "message user-message";


    userMessage.innerHTML = `

        <div class="message-content">

            <div class="message-name">
                You
            </div>

            <div class="message-text"></div>

        </div>

    `;


    userMessage.querySelector(
        ".message-text"
    ).textContent = message;


    chat.appendChild(
        userMessage
    );


    input.value = "";


    /* THINKING */

    showThinking();


    try {

        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                }
            );


        const data =
            await response.json();


        removeThinking();


        /* AI MESSAGE - LEFT */

        const aiMessage =
            document.createElement("div");


        aiMessage.className =
            "message ai-message";


        aiMessage.innerHTML = `

            <div class="avatar">
                H
            </div>

            <div class="message-content">

                <div class="message-name">
                    HERVIX AI
                </div>

                <div class="message-text"></div>

                <button
                    class="listen-button"
                    onclick="speakReply(this)"
                >
                    🔊 Listen
                </button>

            </div>

        `;


        const replyText =
            data.reply ||
            "No response received.";


        aiMessage.querySelector(
            ".message-text"
        ).textContent =
            replyText;


        aiMessage
            .querySelector(".listen-button")
            .dataset.text =
            replyText;


        chat.appendChild(
            aiMessage
        );

    }


    catch (error) {

        removeThinking();


        const errorMessage =
            document.createElement("div");


        errorMessage.className =
            "message ai-message";


        errorMessage.innerHTML = `

            <div class="avatar">
                H
            </div>

            <div class="message-content">

                <div class="message-name">
                    HERVIX AI
                </div>

                <div class="message-text">
                    HERVIX AI is unable to connect right now.
                </div>

            </div>

        `;


        chat.appendChild(
            errorMessage
        );


        console.error(error);

    }


    scrollToBottom();

}



/* =========================
   AI VOICE
========================= */

function speakReply(button) {

    if (!("speechSynthesis" in window)) {

        alert(
            "Voice reply is not supported in this browser."
        );

        return;
    }


    /* Stop previous voice */

    window.speechSynthesis.cancel();


    const text =
        button.dataset.text;


    if (!text) {
        return;
    }


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang = "en-US";
    speech.rate = 0.95;
    speech.pitch = 1;
    speech.volume = 1;


    window.speechSynthesis.speak(
        speech
    );

}



/* =========================
   SUGGESTIONS
========================= */

function useSuggestion(text) {

    const input =
        document.getElementById(
            "messageInput"
        );


    input.value = text;

    input.focus();

}



/* =========================
   SCROLL
========================= */

function scrollToBottom() {

    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });

}



/* =========================
   ENTER
========================= */

document
    .getElementById(
        "messageInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


</script>

</body>
</html>
